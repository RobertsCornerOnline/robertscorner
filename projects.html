<!-- ===== PAGE SCRIPT: project list + filter ===== -->
<script>
/* Project data. k = category key, live:1 shows the "Online" badge, l = [label, url] links */
const PROJECTS = [
  { t: "Book Indent Management System", k: "web",
    d: "Django and PostgreSQL platform where faculty submit book indents, staff verify and deduplicate them, and approvers sign off with role-based workflows.",
    p: ["Django", "PostgreSQL", "Gunicorn", "Docker Compose"], live: 1,
    l: [["Open live app", "https://indent.robertscorner.online"], ["Source (.zip)", "downloads/book_indent_system.zip"]] },
  { t: "Koha Library Catalogue (OPAC)", k: "lib",
    d: "Public catalogue with bibliographic search, MARC21 record display, facet filtering and patron self-service.",
    p: ["Koha ILS", "MARC21", "Elasticsearch", "Apache + Nginx"], live: 1,
    l: [["Visit OPAC", "https://catalog.robertscorner.online"]] },
  { t: "Koha Staff Interface", k: "lib",
    d: "Back-office cataloguing, circulation, serials, acquisitions and patron management behind an HTTPS reverse proxy.",
    p: ["Cataloguing", "Circulation", "Acquisitions"], live: 1,
    l: [["Open staff portal", "https://staff.robertscorner.online"]] },
  { t: "DSpace Digital Repository", k: "repo",
    d: "Open-access repository for publications, theses and datasets, running a DSpace backend on Tomcat 10 with an Angular frontend.",
    p: ["DSpace", "Angular SSR", "Tomcat 10", "Dublin Core"], live: 1,
    l: [["Browse repository", "https://repository.robertscorner.online"]] },
  { t: "n8n and LIS Quiz Pipeline", k: "auto",
    d: "Self-hosted workflows that pull practice MCQs from Google Sheets and post them to a Telegram channel.",
    p: ["n8n", "Google Sheets API", "Telegram Bots"], live: 1,
    l: [["Open n8n", "https://automation.robertscorner.online"]] },
  { t: "AI Librarian chatbot prototype", k: "write",
    d: "Prototype chatbot for library enquiries, built alongside my conference research on AI in library services.",
    p: ["Chatbot", "AI in libraries"], l: [] },
  { t: "History of Navalur Kuttappattu", k: "write",
    d: "A book on my home village in Tiruchirappalli covering its formation, geography, economy and cultural practices, written with St. Joseph’s College, Trichy.",
    p: ["Local history", "Research"], l: [] }
];
/* Filter chips: [key, label] */
const KINDS = [["all", "All"], ["lib", "Library systems"], ["repo", "Repositories"], ["web", "Web apps"], ["auto", "Automation"], ["write", "Research and writing"]];
let kind = "all";

/* Render chips + the filtered project rows */
function draw() {
  document.getElementById("chips").innerHTML = KINDS
    .map(([k, n]) => `<button type="button" data-k="${k}" aria-pressed="${k === kind}">${n}</button>`).join("");
  const list = PROJECTS.filter(p => kind === "all" || p.k === kind);
  document.getElementById("plist").innerHTML = list.map(p => `
    <article class="row">
      <div><h3>${p.t}</h3><p>${p.d}</p>
        <div class="pills">${p.p.map(x => `<span class="pill">${x}</span>`).join("")}</div></div>
      <div class="go">${p.live ? '<span class="live">Online</span>' : ""}
        ${p.l.map((x, i) => `<a class="btn sm${i ? " alt" : ""}" href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join("")}</div>
    </article>`).join("");
}
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) { kind = b.dataset.k; draw(); }
});
draw();
</script>
