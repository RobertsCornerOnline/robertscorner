<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery | Sebastine Robert S</title>
<meta name="description" content="Photographs by Sebastine Robert S, and a few pictures of him.">
<meta property="og:title" content="Gallery | Sebastine Robert S">
<meta property="og:description" content="Photographs by Sebastine Robert S, and a few pictures of him.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;700&family=Noto+Serif+Tamil:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<!-- Apply saved theme before first paint (prevents a light/dark flash) -->
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- ===== HEADER / NAVIGATION ===== -->
<header><div class="wrap bar">
<a class="mark" href="index.html">Robert’s Corner</a>
<nav aria-label="Primary">
<a href="index.html">Home</a>
<a href="projects.html">Projects</a>
<a href="about.html">About</a>
<a href="gallery.html" aria-current="page">Gallery</a>
<a href="resume.html">Resume</a>
<a href="contact.html">Contact</a>
<!-- Theme toggle: icon only (moon = go dark, sun = go light) -->
<button class="tool icon" id="theme" type="button" aria-label="Switch colour theme" title="Switch theme">
<svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
<svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
</nav></div></header>

<!-- ===== MAIN ===== -->
<main class="wrap" id="main">
<h2 class="pg">Gallery</h2>
<p class="sub">Photographs I took, and a few of me. Select any picture to view it larger.</p>
<div class="tabs" role="tablist" id="gtabs">
<button role="tab" type="button" data-g="photos" aria-selected="true">Photographs</button>
<button role="tab" type="button" data-g="me" aria-selected="false">Myself</button>
</div>
<div class="gallery" id="grid" role="tabpanel"></div>

<!-- Lightbox (native <dialog>: Esc closes, focus is handled by the browser) -->
<dialog class="lightbox" id="lb" aria-label="Image viewer">
<button class="lb-x" type="button" id="lb-close" aria-label="Close">×</button>
<button class="lb-n prev" type="button" id="lb-prev" aria-label="Previous picture">‹</button>
<figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
<button class="lb-n next" type="button" id="lb-next" aria-label="Next picture">›</button>
</dialog>
</main>

<!-- ===== FOOTER ===== -->
<footer><div class="wrap"><span>© 2026 Sebastine Robert S, Chennai, India</span><span><a href="index.html">Back to home</a></span></div></footer>

<button class="totop" id="totop" type="button" aria-label="Back to top">↑</button>
<script src="script.js" defer></script>

<!-- ===== PAGE SCRIPT: gallery tabs + lightbox ===== -->
<script>
/* Picture lists: src = local file, title = short label, cap = full caption (optional) */
const SETS = {
  photos: [
 {
  "src": "images/photographs/01-forest-tower.jpg",
  "title": "Forest, with a tower",
  "cap": "When you’re just trying to enjoy a peaceful day in the forest, but humans keep adding more ‘features’ to your home. Wi-Fi doesn’t grow on trees. #NatureIsMyHome"
 },
 {
  "src": "images/photographs/02-cloud-light.jpg",
  "title": "Chasing the light",
  "cap": "Even on cloudy days, the sun finds a way to shine through. #cloud #outdoor #sky #nature"
 },
 {
  "src": "images/photographs/03-curious.jpg",
  "title": "Something curious",
  "cap": "Something curious in it. #Curious"
 },
 {
  "src": "images/photographs/04-sunset-afterglow.jpg",
  "title": "Afterglow",
  "cap": "Chasing the last light of day as the sun kisses the skyline goodnight. #sunset #afterglow"
 },
 {
  "src": "images/photographs/05-campfire.jpg",
  "title": "Campfire at Junk Cycles",
  "cap": "Chillin’ under the stars with our furry friends at Junk Cycles. #OutdoorAdventures"
 },
 {
  "src": "images/photographs/06-chennai-lighthouse.jpg",
  "title": "Chennai lighthouse",
  "cap": "Just another average day in Chennai, where the lighthouse stands tall against the vibrant sky. #ChennaiVibes"
 },
 {
  "src": "images/photographs/07-tech-detox.jpg",
  "title": "Tech detox",
  "cap": "Taking a moment to clear the stress away. #TechDetox"
 },
 {
  "src": "images/photographs/08-city-nights.jpg",
  "title": "City nights",
  "cap": "Step into the night where the city glows. #CityNights #NeonLights"
 },
 {
  "src": "images/photographs/09-pond-flowers.jpg",
  "title": "Pond flowers",
  "cap": "In the stillness of the pond, two delicate white flowers bloom. #Nature #Pond"
 },
 {
  "src": "images/photographs/10-bird-rainbow.jpg",
  "title": "Bird over a rainbow",
  "cap": "Watching this beautiful bird soar over the rainbow reminds us to embrace the beauty of nature. #rainbow"
 }
],
  me: [
 {
  "src": "images/myself/01.jpg",
  "title": "Photo 1",
  "cap": ""
 },
 {
  "src": "images/myself/02.jpg",
  "title": "Photo 2",
  "cap": ""
 },
 {
  "src": "images/myself/03.jpg",
  "title": "Photo 3",
  "cap": ""
 },
 {
  "src": "images/myself/04.jpg",
  "title": "Photo 4",
  "cap": ""
 },
 {
  "src": "images/myself/05.jpeg",
  "title": "Photo 5",
  "cap": ""
 },
 {
  "src": "images/myself/06.jpg",
  "title": "Photo 6",
  "cap": ""
 },
 {
  "src": "images/myself/07.jpeg",
  "title": "Photo 7",
  "cap": ""
 }
]
};
let set = "photos", cur = 0;
const grid = document.getElementById("grid"), lb = document.getElementById("lb");

/* Draw the thumbnails of the chosen set */
function draw() {
  document.querySelectorAll("#gtabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.g === set));
  grid.innerHTML = SETS[set].map((p, i) => `<figure class="shot"><button type="button" data-i="${i}" aria-label="Open ${p.title}">
    <img src="${p.src}" alt="${p.title}" loading="lazy"></button><figcaption>${p.title}</figcaption></figure>`).join("");
}
/* Show picture n in the lightbox (wraps around at both ends) */
function show(n) {
  const list = SETS[set]; cur = (n + list.length) % list.length;
  document.getElementById("lb-img").src = list[cur].src;
  document.getElementById("lb-img").alt = list[cur].title;
  document.getElementById("lb-cap").textContent = list[cur].cap || list[cur].title;
}
document.getElementById("gtabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { set = b.dataset.g; draw(); } });
grid.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) { show(+b.dataset.i); lb.showModal(); } });
document.getElementById("lb-close").addEventListener("click", () => lb.close());
document.getElementById("lb-prev").addEventListener("click", () => show(cur - 1));
document.getElementById("lb-next").addEventListener("click", () => show(cur + 1));
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });          /* click backdrop to close */
lb.addEventListener("keydown", e => { if (e.key === "ArrowLeft") show(cur - 1); if (e.key === "ArrowRight") show(cur + 1); });
draw();
</script>
</body>
</html>
