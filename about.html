<!-- ===== PAGE SCRIPT: About tabs ===== -->
<script>
/* Timeline data per tab: [date, title, description] */
const TABS = {

  work: [
    ["April 2025 to present", "Library Trainee, Central Library, IIT Madras", "Supporting academic library operations, ILS workflows, digital resource management and technical services."],
    ["Earlier", "Bishop Heber College, Tiruchirappalli", "Library operations and academic support services."],
],

education: [
    ["Enrolled July 2026", "PGDLAN, IGNOU", "Post Graduate Diploma in Library Automation Networking."],

    ["Completed", "M.Lib.I.Sc., Master of Library and Information Science", "Two-year integrated postgraduate programme. Cumulative 82.79%, weighted average 79.53%."]
  ],

  intern: [
    ["May 2024, one month", "Library Intern, IIT Madras", "Cataloguing with MARC21 and UDC, Virtua ILS for circulation and RFID, shelving and collection rectification."],
    ["June 2024, one week", "Library Intern, Indian Institute of Astrophysics", "Patron services, shelving, Koha cataloguing and circulation, and daily library management."],

    ["November 2023, one week", "Library Intern, Tamil Nadu National Law University", "Patron services, shelving, Koha cataloguing and circulation, and daily library management."],
    ["December 2022, one month", "Intern, District Central Library, Tiruchirappalli", "Shelving, classification and book-keeping of library transactions."]
  ],
  pubs: [
    ["March 2025", "Enhancing Classroom Engagement with Slido", "Presented at SDSTLISER-2025, Bishop Heber College."],
    ["October 2024", "Integration of AI Tools to Enhance Library Services in the Digital Era", "Presented at LISACON 2024, Bharathidasan University. Covers chatbots, machine learning and recommender systems, plus the ethical limits."],
    ["June 2024", "Transforming Library Services: Integration of Chatbots in the Contemporary Era", "Presented at MILAN-APLAI 2024, University of Mysore."]
  ]
};
/* Skills data: [heading, description] */
const SKILLS = [
  ["Cataloguing and metadata", "MARC21, RDA, Dublin Core, and comparison of AI-generated metadata against human cataloguing."],
  ["Library and repository software", "Koha ILS (staff and OPAC), DSpace, Virtua ILS."],
  ["Infrastructure and networking", "Debian administration, Nginx reverse proxy, Let’s Encrypt, Cloudflare DNS and WAF, Docker Compose, IPv4 and IPv6."],
  ["Programming and automation", "Python, Django, HTML5 and CSS3, n8n, Make.com, Google Sheets API."]
];
/* Render the chosen tab and mark it selected */
function draw(tab) {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === tab));
  document.getElementById("tabbody").innerHTML = tab === "skills"
    ? `<div class="skills">${SKILLS.map(s => `<div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div>`
    : `<ol class="tl">${TABS[tab].map(e => `<li><time>${e[0]}</time><h3>${e[1]}</h3><p>${e[2]}</p></li>`).join("")}</ol>`;
}
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) draw(b.dataset.t);
});
draw("work");
</script>
